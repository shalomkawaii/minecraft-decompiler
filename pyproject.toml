[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdc"
version = "1.0.0"
description = "Decompile Minecraft JARs into source folders and detect obfuscation automatically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "shalomkawaii" }]
keywords = ["minecraft", "decompiler", "vineflower", "obfuscation", "java"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.scripts]
mcdc = "mcdc.cli:main"

[project.urls]
Homepage = "https://github.com/shalomkawaii/minecraft-decompiler"
Issues = "https://github.com/shalomkawaii/minecraft-decompiler/issues"
Source = "https://github.com/shalomkawaii/minecraft-decompiler"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcdc = ["py.typed"]
